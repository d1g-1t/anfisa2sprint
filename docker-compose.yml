services:
  db:
    image: postgres:15
    container_name: candies_catalog_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-candies_catalog}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5433:5432"
    networks:
      - candies_catalog_network

  redis:
    image: redis:7-alpine
    container_name: candies_catalog_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - candies_catalog_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: candies_catalog_web
    command: sh -c "sleep 20 && python backend/manage.py migrate && python backend/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8002:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-candies_catalog}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - POSTGRES_DB=${POSTGRES_DB:-candies_catalog}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      - db
      - redis
    networks:
      - candies_catalog_network

  nginx:
    image: nginx:1.25-alpine
    container_name: candies_catalog_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - candies_catalog_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  candies_catalog_network:
    driver: bridge
